# CI: runs on every push and pull request. Everything here is OFFLINE:
# tests use FakeToolModel, and the eval step runs the regex-only safety eval,
# so no API key (no secret) is needed and a run costs nothing.
# The live evals (--classifier, --rubric) are run by hand before a release.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read  # least privilege: this workflow only reads the repo

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Unit and graph tests
        run: python -m pytest -q

      # Regression gate: fails the build if a pattern edit drops regex recall
      # on the dev set below today's 80%. (Held-out numbers are for reporting,
      # not gating: gating on them would slowly turn them into a dev set.)
      - name: Offline safety eval
        run: python evals/run_evals.py --label ci --min-recall 0.8

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: evals/reports/*-ci.md
